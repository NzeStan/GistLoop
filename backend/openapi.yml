openapi: 3.0.3
info:
  title: GistLoop API
  version: 1.0.0
  description: The GistLoop API, built on the University platform.
paths:
  /api/v1/analytics/metrics/:
    get:
      operationId: analytics_metrics_list
      tags:
      - analytics
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /api/v1/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      parameters:
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: metrics
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - analytics
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/scopes/{scope_type}/{scope_id}/:
    get:
      operationId: analytics_scopes_retrieve
      description: Analytics for one scope (an institution, community …), e.g. for
        its leadership.
      parameters:
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: metrics
        schema:
          type: string
      - in: path
        name: scope_id
        schema:
          type: string
        required: true
      - in: path
        name: scope_type
        schema:
          type: string
        required: true
      - in: query
        name: to
        schema:
          type: string
      tags:
      - analytics
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/views/:
    post:
      operationId: analytics_views_create
      description: Report that the caller viewed a piece of content (counted once
        per window; nobody stored).
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsViewRequest'
        required: true
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsViewResult'
          description: ''
