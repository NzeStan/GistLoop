components:
  schemas:
    APIKey:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        lookup:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        allowed_ips:
          readOnly: true
          description: CIDR ranges; empty allows any.
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - allowed_ips
      - created_at
      - expires_at
      - id
      - last_used_at
      - lookup
      - name
      - revoked_at
      - scopes
    APIKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 100
          minItems: 1
        allowed_ips:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 50
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
      - scopes
    APIKeyCreated:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        lookup:
          type: string
          readOnly: true
        scopes:
          readOnly: true
        allowed_ips:
          readOnly: true
          description: CIDR ranges; empty allows any.
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        key:
          type: string
          readOnly: true
          description: Shown only once.
      required:
      - allowed_ips
      - created_at
      - expires_at
      - id
      - key
      - last_used_at
      - lookup
      - name
      - revoked_at
      - scopes
    AcademicSession:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: e.g. 2025/2026
          maxLength: 50
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_current:
          type: boolean
          readOnly: true
        semesters:
          type: array
          items:
            $ref: '#/components/schemas/Semester'
          readOnly: true
      required:
      - ends_on
      - id
      - is_current
      - name
      - semesters
      - starts_on
    AcademicSessionRequest:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        name:
          type: string
          minLength: 1
          description: e.g. 2025/2026
          maxLength: 50
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        make_current:
          type: boolean
          writeOnly: true
          default: false
      required:
      - ends_on
      - name
      - starts_on
    AcademicUnit:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        unit_type:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 50
        code:
          type: string
          maxLength: 32
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          format: uuid
          nullable: true
        campus:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
      required:
      - id
      - name
      - unit_type
    AcademicUnitRequest:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        unit_type:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_name:
          type: string
          maxLength: 50
        code:
          type: string
          maxLength: 32
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          format: uuid
          nullable: true
        campus:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
      required:
      - name
      - unit_type
    AccessToken:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
    Action:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ModerationActionEnum'
          readOnly: true
        content_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        target_user:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        actor:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        automated:
          type: boolean
          readOnly: true
        reason:
          type: string
          readOnly: true
        explanation:
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reversed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reversal_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - automated
      - content_type
      - created_at
      - expires_at
      - explanation
      - id
      - object_id
      - reason
      - reversal_reason
      - reversed_at
      - target_user
    ActionCreateRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ModerationActionEnum'
        reason:
          type: string
          default: ''
          maxLength: 500
        duration_hours:
          type: integer
          minimum: 1
          nullable: true
        restriction_kind:
          allOf:
          - $ref: '#/components/schemas/RestrictionKindEnum'
          default: posting
      required:
      - action
    Activity:
      type: object
      description: A user's own activity — no internal metadata.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/AuditOutcomeEnum'
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
      required:
      - action
      - created_at
      - id
      - ip_address
      - outcome
      - user_agent
    AllowMentionsFromEnum:
      enum:
      - everyone
      - following
      - nobody
      type: string
      description: |-
        * `everyone` - Everyone
        * `following` - People I follow
        * `nobody` - Nobody
    AnalyticsViewRequest:
      type: object
      properties:
        content_type:
          type: string
          minLength: 1
          maxLength: 64
        object_id:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - content_type
      - object_id
    AnalyticsViewResult:
      type: object
      properties:
        counted:
          type: boolean
      required:
      - counted
    AnnouncementAudienceEnum:
      enum:
      - public
      - members
      type: string
      description: |-
        * `public` - Everyone
        * `members` - Verified members
    AnonymousAnswerRequest:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 20000
        public:
          type: boolean
          default: false
          description: Show the question and answer on your profile.
      required:
      - answer
    AnonymousAudience:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
      required:
      - id
      - type
    AnonymousAuthor:
      type: object
      properties:
        anonymous:
          type: boolean
      required:
      - anonymous
    AnonymousComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        post:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/AnonymousCommentAuthor'
          readOnly: true
        body:
          type: string
          readOnly: true
        viewer:
          allOf:
          - $ref: '#/components/schemas/AnonymousCommentViewer'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - post
      - viewer
    AnonymousCommentAuthor:
