          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_at_period_end:
          type: boolean
          readOnly: true
        payment_due:
          allOf:
          - $ref: '#/components/schemas/SubscriptionPaymentHint'
          nullable: true
          readOnly: true
        periods:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPeriod'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancel_at_period_end
      - created_at
      - currency
      - current_period_end
      - current_period_start
      - id
      - interval
      - payment_due
      - periods
      - plan
      - plan_name
      - status
    SubscriptionEntitlement:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
      required:
      - key
      - label
    SubscriptionPaymentHint:
      type: object
      description: Pass to POST /payments/checkout/ to pay what's due.
      properties:
        purpose:
          type: string
        object_id:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
      required:
      - amount_minor
      - currency
      - object_id
      - purpose
    SubscriptionPeriod:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        amount_minor:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        payment_reference:
          type: string
          readOnly: true
      required:
      - amount_minor
      - currency
      - ends_at
      - payment_reference
      - starts_at
    SubscriptionPlan:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        prices:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPrice'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEntitlement'
      required:
      - description
      - entitlements
      - key
      - name
      - prices
    SubscriptionPrice:
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/IntervalEnum'
        currency:
          type: string
        amount_minor:
          type: integer
      required:
      - amount_minor
      - currency
      - interval
    SubscriptionStatusEnum:
      enum:
      - pending_payment
      - active
      - past_due
      - expired
      - abandoned
      type: string
      description: |-
        * `pending_payment` - Awaiting first payment
        * `active` - Active
        * `past_due` - Renewal due (grace period)
        * `expired` - Expired
        * `abandoned` - Never paid
    TokenPair:
      type: object
      properties:
        token_type:
          type: string
        access:
          type: string
        refresh:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
      required:
      - access
      - access_expires_at
      - refresh
      - refresh_expires_at
      - session_id
      - token_type
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - token
    TopicEnum:
      enum:
      - general
      - support
      - safety
      - partnerships
      - advertising
      - press
      - feedback
      type: string
      description: |-
        * `general` - General question
        * `support` - Account and technical support
        * `safety` - Safety or abuse
        * `partnerships` - Partnerships and institutions
        * `advertising` - Advertising and creators
        * `press` - Press and media
        * `feedback` - Feedback and ideas
    TranscriptFormatEnum:
      enum:
      - vtt
      - srt
      - text
      type: string
      description: |-
        * `vtt` - WebVTT
        * `srt` - SubRip
        * `text` - Plain text
    TrendingItem:
      type: object
      properties:
        content_type:
          type: string
        object_id:
          type: string
        score:
          type: number
          format: double
        title:
          type: string
      required:
      - content_type
      - object_id
      - score
      - title
    UserStatusEnum:
      enum:
      - pending
      - active
      - inactive
      - suspended
      - banned
      - deleted
      type: string
      description: |-
        * `pending` - Pending verification
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
        * `banned` - Banned
        * `deleted` - Deleted
    UserSummary:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        handle:
          type: string
          readOnly: true
          nullable: true
          description: Optional public username.
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - avatar_url
      - display_name
      - handle
      - id
    Verification:
      type: object
      description: ModelSerializer with explicit-fields enforcement.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        method:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        evidence:
          readOnly: true
        has_document:
          type: boolean
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_reason:
          type: string
          readOnly: true
      required:
      - decided_at
      - decision_reason
      - evidence
      - expires_at
      - has_document
      - id
      - method
      - status
    VerificationCompleteRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
    VerificationStartRequest:
      type: object
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 32
        email:
          type: string
          format: email
          minLength: 1
        identifier:
          type: string
          minLength: 1
          maxLength: 64
        note:
          type: string
          maxLength: 500
        document:
          type: string
          format: binary
      required:
      - method
    VerificationStatusEnum:
      enum:
      - pending_review
      - awaiting_user
      - approved
      - rejected
      - expired
      - cancelled
      type: string
      description: |-
        * `pending_review` - Pending review
        * `awaiting_user` - Awaiting user action
        * `approved` - Approved
        * `rejected` - Rejected
        * `expired` - Expired
        * `cancelled` - Cancelled
    WorkModeEnum:
      enum:
      - on_site
      - remote
      - hybrid
      type: string
      description: |-
        * `on_site` - On site
        * `remote` - Remote
        * `hybrid` - Hybrid
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for trusted integrations, limited to its permission scopes.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /auth/login/ or /auth/token/refresh/.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
