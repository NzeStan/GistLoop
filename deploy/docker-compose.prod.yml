# A complete production stack on one server. Put a TLS terminator in front of "web".
#   cp backend/.env.example deploy/.env   # then fill in real secrets (DJANGO_DEBUG=false!)
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml exec api python manage.py migrate
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    env_file: .env
    environment:
      DATABASE_URL: postgres://gistloop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/gistloop
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      TRUSTED_PROXY_COUNT: "2"
      # Django serves /media/ behind nginx (cached there). Set false when MEDIA_URL is a CDN.
      SERVE_MEDIA: ${SERVE_MEDIA:-true}
    # Uploads persist across deploys. With object storage (S3, R2, Cloudinary) you can drop these.
    volumes: [media:/app/media, private-media:/app/private-media]
    depends_on: [postgres, redis]
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    command: ["celery", "-A", "gistloop", "worker", "--beat", "--loglevel", "info"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gistloop:${POSTGRES_PASSWORD}@postgres:5432/gistloop
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes: [media:/app/media, private-media:/app/private-media]
    depends_on: [postgres, redis]
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gistloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gistloop
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
  media:
  private-media:
