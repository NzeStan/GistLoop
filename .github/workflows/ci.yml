name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gistloop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GISTLOOP_TEST_DB: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gistloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=true python manage.py makemigrations --check --dry-run
      - run: pytest
      - name: OpenAPI schema matches the frontend's types
        run: |
          DJANGO_DEBUG=true python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yml
          diff -u openapi.yml /tmp/openapi.yml || { echo "Run 'python manage.py spectacular --file openapi.yml' and 'npm run api:types'."; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Generated API types are current
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
